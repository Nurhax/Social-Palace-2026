name: sopal
description: "SoPal - Social Palace, a Persona-style Social Link tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.6
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  audioplayers: ^6.8.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/arcana/
    - assets/audio/sfx/
    - assets/audio/bgm/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/Logov2.png"
  adaptive_icon_background: "#CE3333"
  adaptive_icon_foreground: "assets/images/Logov2_Circle.png"

flutter_native_splash:
  color: "#CE3333"
  image: "assets/images/Logov2_CircleSmall.png"
  android: true
  android_12:
    color: "#CE3333"
    image: "assets/images/Logov2_CircleSmall.png"
